# Cloudflare Pages config. Build command: npm run build, output: dist.
name = "tihaya-komnata"
pages_build_output_dir = "dist"
compatibility_date = "2026-11-01"
# node:buffer gives native base64 for audio in functions/api/transcribe.ts.
compatibility_flags = ["nodejs_compat"]

# Workers AI binding used by functions/api/transcribe.ts (Whisper).
[ai]
binding = "AI"
